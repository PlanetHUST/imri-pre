[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsi-trap"
version = "0.1.0"
requires-python = ">=3.10"
# Numerical data products are written as .npz / .csv / .json, which numpy and the
# standard library already cover; no HDF5 dependency is needed.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pagn",
    "matplotlib>=3.7",
    "pandas>=2.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
